worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hinter Firebase/Cloud Run: Weiterleitungen relativ halten (sonst zeigt /lucas -> http://...:8080/lucas/)
    absolute_redirect off;
    port_in_redirect off;

    # ES-Module (.mjs) korrekt als JavaScript ausliefern (pdf.js im Viewer)
    location ~* \.mjs$ {
      default_type application/javascript;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /lucas ohne Slash -> /lucas/ (Kontakt-Landingpage, QR/NFC)
    location = /lucas { return 301 /lucas/; }

    # Alte Beispiel-Seite -> Beispielbericht (PDF)
    location = /zustandsbericht-beispiel.html { return 301 /CAIPEX-Beispielbericht.pdf; }

    # vCard korrekt ausliefern (Kontakt speichern)
    location ~* \.vcf$ {
      default_type text/vcard;
      charset utf-8;
      charset_types text/vcard;
      add_header Cache-Control "no-cache";
    }

    # Statische Assets lange cachen
    location ~* \.(woff2|jpg|jpeg|png|webp|gif|pdf|css)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML nie hart cachen (Updates sofort sichtbar)
    location ~* \.html$ {
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
